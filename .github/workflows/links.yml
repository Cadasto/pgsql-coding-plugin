name: links

# Every URL a skill, agent, rule, or doc cites must still resolve — a moved page is a hole in a
# rule's provenance. Needs the network, so it runs apart from `validate`: weekly, on demand, and on
# pull requests that touch the files that carry citations or the checker/workflow that resolves them.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'rules/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'scripts/validate.py'
      - '.github/workflows/links.yml'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/validate.py --check-links

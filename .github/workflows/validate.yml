name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # CI is strict and deterministic: Python is guaranteed here, so run the
      # validator directly (the scripts/validate.sh graceful skip is for local use).
      - run: python3 scripts/validate.py
      # A green validator proves the tree is valid, not that the checks still check.
      - run: python3 scripts/validate.py --selftest
      # Bash-only hook tests; lint-on-save runs against a stub squawk, so no install is needed.
      - run: ./scripts/hooks-test.sh
      # The plan summariser against real PostgreSQL 18.6 plans in scripts/testdata/plans/.
      - run: python3 scripts/plan-summary-test.py
